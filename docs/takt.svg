<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="220" rx="18" fill="#0d1117"/>
  <text x="28" y="40" fill="#e6edf3" font-size="16" font-weight="700">Eine Minute auf dem VPS</text>
  <text x="28" y="62" fill="#8b93a1" font-size="12.5">Die Bots laufen zur vollen Minute, das Cockpit 30 Sekunden später. Sie kommen sich nicht in die Quere.</text>

  <!-- Zeitachse -->
  <line x1="60" y1="150" x2="860" y2="150" stroke="#30363d" stroke-width="2"/>
  <g fill="#8b93a1" font-size="12" text-anchor="middle">
    <line x1="60" y1="144" x2="60" y2="156" stroke="#8b93a1"/><text x="60" y="176">:00</text>
    <line x1="260" y1="146" x2="260" y2="154" stroke="#30363d"/><text x="260" y="176">:15</text>
    <line x1="460" y1="144" x2="460" y2="156" stroke="#8b93a1"/><text x="460" y="176">:30</text>
    <line x1="660" y1="146" x2="660" y2="154" stroke="#30363d"/><text x="660" y="176">:45</text>
    <line x1="860" y1="144" x2="860" y2="156" stroke="#8b93a1"/><text x="860" y="176">:00</text>
  </g>

  <!-- Bots -->
  <rect x="60" y="92" width="190" height="34" rx="8" fill="#123524" stroke="#3ecf8e"/>
  <text x="74" y="114" fill="#3ecf8e" font-size="13" font-weight="600">Bots: Kerzen, Signale, Orders</text>

  <!-- Cockpit -->
  <rect x="460" y="92" width="110" height="34" rx="8" fill="#13233a" stroke="#5b9cff"/>
  <text x="472" y="114" fill="#5b9cff" font-size="13" font-weight="600">Cockpit liest</text>
  <text x="582" y="106" fill="#8b93a1" font-size="12">≈ 5 Abfragen pro Konto:</text>
  <text x="582" y="122" fill="#8b93a1" font-size="12">Kontostand, Positionen, Orders, SL/TP</text>

  <text x="28" y="204" fill="#8b93a1" font-size="12">Geschlossene Trades und Kontoauszug zusätzlich nur alle 10 Minuten. Bitgets Grenze liegt bei mehreren Abfragen pro Sekunde.</text>
</svg>
